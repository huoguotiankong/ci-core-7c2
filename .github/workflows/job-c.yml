name: Job C

on:
  workflow_dispatch:
    inputs:
      mode:
        description: One-time initialize or normal build
        type: choice
        options: [build, initialize]
        default: build
  push:
    branches: [main]
    paths: [trigger/release.txt]

permissions:
  contents: read

concurrency:
  group: job-c
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Validate bridge configuration
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.BRIDGE_REPO }}
          SOURCE_TOKEN: ${{ secrets.MX_READER_TOKEN }}
          RESULT_TOKEN: ${{ secrets.BRIDGE_RESULT_TOKEN }}
          SIGNING_PASSWORD: ${{ secrets.MX_READER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPO" || -z "$SOURCE_TOKEN" || -z "$RESULT_TOKEN" || ${#SIGNING_PASSWORD} -lt 32 ]]; then
            echo "::error::Missing bridge or signing configuration"
            exit 1
          fi
          private="$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO" --jq .private 2>/dev/null)"
          [[ "$private" == true ]] || { echo "::error::Private source required"; exit 1; }

      - name: Fetch exact private candidate
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.BRIDGE_REPO }}
          SOURCE_TOKEN: ${{ secrets.MX_READER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          auth="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          mkdir private-src
          if ! (cd private-src && git init && git fetch --no-tags --depth=1 "https://github.com/$SOURCE_REPO.git" refs/heads/release/beta && git checkout --detach FETCH_HEAD) > "$RUNNER_TEMP/fetch.log" 2>&1; then
            echo "::error::Private source fetch failed"
            exit 1
          fi
          test -f private-src/ci/release/build-signed-beta.py
          test -f private-src/ci/release/signing-vault.py

      - name: Configure JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare persistent signing vault
        working-directory: private-src
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.BRIDGE_REPO }}
          SOURCE_TOKEN: ${{ secrets.MX_READER_TOKEN }}
          RESULT_TOKEN: ${{ secrets.BRIDGE_RESULT_TOKEN }}
          MX_READER_SIGNING_PASSWORD: ${{ secrets.MX_READER_SIGNING_PASSWORD }}
          MODE: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'init-job-c-once' && 'initialize') || inputs.mode || 'build' }}
        run: |
          set -euo pipefail
          if ! python3 ci/release/signing-vault.py prepare "$MODE" > "$RUNNER_TEMP/vault.log" 2>&1; then
            diagnostic="$(grep -E '^SAFE_DIAGNOSTIC=[A-Z_0-9]+$' "$RUNNER_TEMP/vault.log" | tail -1 || true)"
            echo "::error::Vault initialization or retrieval failed (${diagnostic:-UNKNOWN}). Never replace the password or regenerate an existing key."
            exit 1
          fi
          echo "Persistent vault verified"

      - name: Prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1; then
            echo "::error::SDK setup failed"
            exit 1
          fi
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build and verify private package
        id: package_build
        working-directory: private-src
        shell: bash
        env:
          MX_READER_SIGNING_PASSWORD: ${{ secrets.MX_READER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if ! python3 ci/release/signing-vault.py build > "$RUNNER_TEMP/build-private.log" 2>&1; then
            diagnostic="$(grep -E '^SAFE_DIAGNOSTIC=[A-Z_0-9]+$' "$RUNNER_TEMP/build-private.log" | tail -1 || true)"
            echo "::error::Private build or signing verification failed (${diagnostic:-UNKNOWN})"
            exit 1
          fi
          echo "Build and verification passed"

      - name: Preserve bounded private diagnostic
        if: failure() && steps.package_build.outcome == 'failure'
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.BRIDGE_REPO }}
          GH_TOKEN: ${{ secrets.BRIDGE_RESULT_TOKEN }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/private-build-diagnostic.json"
          if [ ! -f "$report" ]; then
            echo "No stage diagnostic available"
            exit 0
          fi
          # The private build creates only fixed categories and bounded task identifiers.
          jq -e 'type == "object" and ((keys == ["failedTasks","reason","stage"]) or (keys == ["compilerErrors","failedTasks","reason","stage"] and (.compilerErrors | type == "array" and length <= 20) and all(.compilerErrors[]; (keys == ["column","file","kind","line"]) and (.file | test("^[A-Za-z][A-Za-z0-9_]{0,100}\\.kt$")) and (.line | type == "number" and . >= 0 and . <= 999999 and . == floor) and (.column | type == "number" and . >= 0 and . <= 999999 and . == floor) and (.kind | test("^(UNRESOLVED_REFERENCE|TYPE_MISMATCH|ACCESS|OVERLOAD|OVERRIDE|SYNTAX|OTHER)$"))))) and (.stage | test("^[A-Z_]+$")) and (.reason | test("^[A-Z_]+$")) and (.failedTasks | length <= 15) and all(.failedTasks[]; test("^:[A-Za-z0-9_:-]{1,180}$"))' "$report" >/dev/null
          [[ "$(gh api "repos/$SOURCE_REPO" --jq .private 2>/dev/null)" == true ]]
          jq -n --arg content "$(base64 -w0 "$report")" --arg branch "ci-results" --arg message "Record bounded build diagnostic" '{content:$content,branch:$branch,message:$message}' > "$RUNNER_TEMP/diagnostic-request.json"
          if ! gh api --method PUT "repos/$SOURCE_REPO/contents/diagnostics/build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" --input "$RUNNER_TEMP/diagnostic-request.json" > /dev/null 2>&1; then
            echo "::warning::Unable to preserve private diagnostic"
          else
            echo "Bounded diagnostic saved privately"
          fi

      - name: Publish privately
        working-directory: private-src
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.BRIDGE_REPO }}
          GH_TOKEN: ${{ secrets.BRIDGE_RESULT_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/private-release"
          tag="$(jq -er .tag "$dir/release.json")"
          commit="$(jq -er .commit "$dir/release.json")"
          version="$(jq -er .version "$dir/release.json")"
          title="$(jq -er .title "$dir/release.json")"
          notes="$(jq -er .notes "$dir/release.json")"
          apk="$(jq -er .apk "$dir/release.json")"
          source="$(jq -er .source "$dir/release.json")"
          [[ "$(gh api "repos/$SOURCE_REPO" --jq .private 2>/dev/null)" == true ]]
          [[ "$commit" == "$(git rev-parse HEAD)" ]]
          [[ "$tag" == "v$version" ]]
          if ! gh release create "$tag" --repo "$SOURCE_REPO" --target "$commit" --title "$title" --notes-file "$notes" --prerelease "$apk" "$source" "$dir/CERT_SHA256.txt" "$dir/SHA256SUMS.txt" > "$RUNNER_TEMP/publish.log" 2>&1; then
            echo "::error::Private release failed; existing releases are not overwritten"
            exit 1
          fi
          echo "Private release published"

      - name: Remove private files
        if: always()
        shell: bash
        run: |
          rm -rf private-src "$RUNNER_TEMP/private-release" "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/sdk.log" "$RUNNER_TEMP/build-private.log" "$RUNNER_TEMP/publish.log" "$RUNNER_TEMP/vault.log" "$RUNNER_TEMP/private-vault.json" "$RUNNER_TEMP/private-build-diagnostic.json" "$RUNNER_TEMP/diagnostic-request.json"
