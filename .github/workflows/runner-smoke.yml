name: Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runtime check
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=ok"
          echo "repository_visibility=public"
          echo "private_source_checkout=disabled_until_secret_is_configured"
