name: Bridge Smoke

on:
  push:
    branches:
      - main
    paths:
      - trigger/bridge.txt
      - .github/workflows/bridge-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Source access check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SRC_REPO: ${{ secrets.SRC_REPO }}
          SRC_REF: ${{ secrets.SRC_REF }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SRC_REPO" || { echo "::error::SRC_REPO is missing"; exit 1; }
          test -n "$SRC_REF" || { echo "::error::SRC_REF is missing"; exit 1; }
          test -n "$SRC_TOKEN" || { echo "::error::SRC_TOKEN is missing"; exit 1; }
          echo "Required secrets are present."

      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ secrets.SRC_REPO }}
          ref: ${{ secrets.SRC_REF }}
          token: ${{ secrets.SRC_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout without exposing source
        shell: bash
        run: |
          set -euo pipefail
          test -d source/.git
          test -n "$(git -C source rev-parse HEAD)"
          test -z "$(git -C source status --porcelain)"
          echo "Private source checkout succeeded."

      - name: Remove source workspace
        if: always()
        shell: bash
        run: |
          rm -rf source
          echo "Workspace cleaned."
